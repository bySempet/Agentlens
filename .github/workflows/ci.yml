name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install & test
        working-directory: agentlens/sdk-python
        run: |
          pip install -e ".[dev]"
          pytest -q

  go-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ingestion, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build, vet & test
        working-directory: agentlens/${{ matrix.module }}
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

  node-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck, test & build
        working-directory: agentlens/sdk-node
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build dashboard
        working-directory: agentlens/frontend
        run: |
          npm ci
          npm run build
