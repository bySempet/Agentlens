services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: agentlens-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    environment:
      CLICKHOUSE_DB: agentlens
      CLICKHOUSE_USER: agentlens
      CLICKHOUSE_PASSWORD: agentlens
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Plano de control (orgs/usuarios/agentes/políticas). Las migraciones de
  # deploy/postgres/migrations se aplican al primer arranque. En producción se usa
  # el runner versionado deploy/postgres/migrate.sh.
  postgres:
    image: postgres:16
    container_name: agentlens-postgres
    environment:
      POSTGRES_DB: agentlens
      POSTGRES_USER: agentlens
      POSTGRES_PASSWORD: agentlens
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: agentlens-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC  <- el SDK exporta aquí
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - clickhouse

volumes:
  ch-data:
  pg-data:
